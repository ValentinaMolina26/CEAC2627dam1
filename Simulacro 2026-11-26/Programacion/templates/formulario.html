<!doctype html>
<html>
<head>
    <title>Nuevo vehículo</title>
</head>
<body>
    <h1>Introducir nuevo vehículo</h1>
    <form action="/formulario" method="POST">

        <label>Marca:</label>
        <input type="text" name="marca"><br><br>

        <label>Modelo:</label>
        <input type="text" name="modelo"><br><br>

        <label>Versión:</label>
        <input type="text" name="version"><br><br>

        <label>Categoría:</label>
        <input type="text" name="categoria"><br><br>

        <label>Descripción:</label>
        <input type="text" name="descripcion"><br><br>

        <label>Año de fabricación:</label>
        <input type="number" name="anio_fabricacion"><br><br>

        <label>Fecha de matriculación:</label>
        <input type="date" name="fecha_matriculacion"><br><br>

        <label>Matrícula:</label>
        <input type="text" name="matricula"><br><br>

        <label>País:</label>
        <input type="text" name="pais"><br><br>

        <label>Color:</label>
        <input type="text" name="color"><br><br>

        <label>Combustible:</label>
        <input type="text" name="combustible"><br><br>

        <label>Potencia:</label>
        <input type="number" name="potencia"><br><br>

        <label>Cilindrada:</label>
        <input type="number" name="cilindrada"><br><br>

        <label>Kilometraje:</label>
        <input type="number" name="kilometraje"><br><br>

        <label>Número de puertas:</label>
        <input type="number" name="numero_puertas"><br><br>

        <label>Número de plazas:</label>
        <input type="number" name="numero_plazas"><br><br>

        <label>Consumo medio:</label>
        <input type="number" step="0.1" name="consumo_medio"><br><br>

        <label>Automático (1 sí / 0 no):</label>
        <input type="number" name="automatico"><br><br>

        <label>Disponible (1 sí / 0 no):</label>
        <input type="number" name="disponible"><br><br>

        <label>Segunda mano (1 sí / 0 no):</label>
        <input type="number" name="segunda_mano"><br><br>

        <label>Imagen:</label>
        <input type="text" name="imagen"><br><br>

        <label>URL fabricante:</label>
        <input type="text" name="url_fabricante"><br><br>

        <label>Precio original:</label>
        <input type="number" step="0.01" name="precio_original"><br><br>

        <label>Precio de venta:</label>
        <input type="number" step="0.01" name="precio_venta"><br><br>

        <label>Garantía vigente (1 sí / 0 no):</label>
        <input type="number" name="garantia_vigente"><br><br>

        <input type="submit" value="Guardar vehículo">
    </form>
</body>
</html>
