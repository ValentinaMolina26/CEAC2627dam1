<!doctype html>
<html>
  <head>
    <style>
      html,body{width:100%;height:100%;padding:0px;margin:0px;
      background:linear-gradient(135deg,#dbeafe,#a5b4fc,#c4b5fd);
      display:flex;align-items:center;justify-content:center;}
      form{width:320px;height:300px;background:white;padding:35px;
      display:flex;flex-direction:column;justify-content:center;gap:20px;
      border-radius:25px;box-shadow:0px 15px 40px #4f46e566;}
      input{border:1px solid #c7d2fe;outline:none;background:#f5f7ff;
        padding:15px;border-radius:12px;color:#37305c;
        font-size:16px;}
      input:focus{border-color:#818cf8;
        box-shadow:0px 0px 8px #a5b4fc;}
      input::placeholder{color:#9295b8;}
      input[type="submit"]{background:#818cf8;color:white;
        border:none;padding:15px;border-radius:12px;
        font-weight:bold;font-size:16px;cursor:pointer;}
      input[type="submit"]:hover{background:#6366f1;}
    </style>
    <meta charset="utf-8">
  </head>
  <body>
    <form>
      <input type="text" placeholder="usuario:" name="usuario">
      <input type="password" placeholder="contraseña:" name="contrasena">
      <input type="submit" value="Iniciar sesión">
    </form>
  </body>
</html>
