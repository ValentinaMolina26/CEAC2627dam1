<!doctype html>
<html>
  <head>
    <style>
      @font-face {
        font-family: jocarsa;
        src: url("https://jocarsa.com/jocarsa.ttf");
      }
      html,body{width:100%;height:100%;padding:0px;margin:0px;background:linear-gradient(135deg,#dbeafe,#c4b5fd);
      display:flex;align-items:center;justify-content:center;gap:30px;
      font-family:sans-serif;font-family:jocarsa,ubuntu;}
      form{width:220px;height:300px;background:white;padding:25px;
      display:flex;flex-direction:column;justify-content:center;gap:15px;
      border-radius:25px;box-shadow:0px 10px 30px rgba(99,102,241,0.2);}
      div{width:250px;height:300px;background:white;padding:25px;
      display:flex;flex-direction:column;justify-content:center;gap:15px;
      border-radius:25px;box-shadow:0px 10px 30px rgba(99,102,241,0.2);align-items:center;
      color:#818cf8;text-align:center;}
      input{border:none;outline:none;background:#f5f7ff;padding:12px;
        border-radius:10px;
      box-shadow:0px 2px 4px rgba(0,0,0,0.05) inset;background:#f5f7ff;color:#4c4770;
      font-size:13px;font-family:jocarsa,ubuntu;border:1px solid #c7d2fe;}
      input[type=submit]{box-shadow:0px 4px 8px rgba(99,102,241,0.25);
      background:#818cf8;color:white;border:none;cursor:pointer;}
      input[type=submit]:hover{background:#6366f1;}
      input:focus{border:1px solid #818cf8;}
      h1{font-size:26px;}
      p{font-size:13px;color:#777594;text-align:center;}
      .indigo{color:#6366f1;}
    </style>
    <meta charset="utf-8">
  </head>
  <body>
    <div>
      <h1><span class="indigo">valentina</span> | login</h1>
      <p>Crea tu propio espacio digital</p>
    </div>
    <form>
      <img src="valen.png">
      <input type="text" placeholder="usuario:" name="usuario">
      <input type="password" placeholder="contraseña:" name="contrasena">
      <input type="submit" value="Iniciar sesión">
    </form>
  </body>
</html>
